<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quranlegacy.com</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="bg-animation">
  <div class="circle c1"></div><div class="circle c2"></div><div class="circle c3"></div>
</div>

<header class="header">
  <div class="logo"><span class="logo-icon">📖</span><h1>Quran<span class="gradient-text">legacy.com</span></h1></div>
  <div class="header-controls">
    <select id="themeSelect">
      <option value="dark">🌙 Dark</option>
      <option value="light">☀️ Light</option>
      <option value="gold">✨ Gold</option>
    </select>
    <button class="admin-btn" id="adminBtn">🔒 Admin</button>
    <button class="upload-btn" id="createSurahBtn" style="display:none;"><span class="plus">+</span> New Surah</button>
  </div>
</header>

<main class="grid-container" id="surahGrid"></main>

<div class="empty-state" id="emptyState">
  <div class="empty-icon">📂</div>
  <h2>No Surahs yet</h2>
  <p>Admin: Click "New Surah" to start!</p>
</div>

<!-- Modal: Create Surah -->
<div class="modal" id="surahModal">
  <div class="modal-content">
    <h2>Create Surah Folder</h2>
    <label>Surah Name</label><input type="text" id="surahName" placeholder="e.g. Al-Baqarah" />
    <label>Surah Number</label><input type="text" id="surahNumber" placeholder="e.g. 2" />
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelSurah">Cancel</button>
      <button class="btn-save" id="saveSurah">Create</button>
    </div>
  </div>
</div>

<!-- Modal: Inside Folder -->
<div class="modal" id="folderModal">
  <div class="modal-content large-modal">
    <div class="modal-header">
      <h2 id="folderTitle">Surah Name</h2>
      <button class="close-btn" id="closeFolder">✕</button>
    </div>
    <div class="folder-actions">
      <button class="upload-btn small" id="uploadAyatBtn" style="display:none;"><span class="plus">+</span> Upload Ayat PDF</button>
    </div>
    <div class="ayat-grid" id="ayatGrid"></div>
  </div>
</div>

<!-- Modal: Upload Ayat -->
<div class="modal" id="ayatModal">
  <div class="modal-content">
    <h2>Upload Ayat PDF</h2>
    <label>Ayat Number</label><input type="number" id="ayatNumber" placeholder="e.g. 1" />
    <input type="file" id="ayatFileInput" accept="application/pdf" hidden />
    <button class="btn-save" id="selectFileBtn" style="width:100%; margin-top:10px;">Select PDF File</button>
    <p id="selectedFileName" style="color:#aaa; margin-top:10px; text-align:center;"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelAyat">Cancel</button>
      <button class="btn-save" id="saveAyat">Upload</button>
    </div>
  </div>
</div>

<!-- PDF Viewer (Edge Style) -->
<div class="viewer" id="viewer">
  <div class="viewer-header">
    <h2 id="viewerTitle">Ayat Viewer</h2>
    <div class="viewer-controls">
      <button id="zoomOutBtn">− Zoom Out</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomInBtn">Zoom In +</button>
      <a id="downloadBtn" href="#" target="_blank" download class="btn-download"> Download</a>
      <button id="closeViewer">✕</button>
    </div>
  </div>
  <div class="viewer-body" id="viewerBody">
    <div id="pdfContainer"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
