<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quranlegacy</title>
<link rel="stylesheet" href="styles.css?v=12" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" defer></script>
</head>
<body>

<header class="header">
  <div class="logo">
    <button id="backBtn" style="display:none; margin-right:15px;">⬅ Back</button>
    <span class="logo-icon"></span>
    <h1>Quran<span class="gradient-text">legacy</span></h1>
  </div>
  <div class="header-controls">
    <select id="themeSelect">
      <option value="dark">🌙 Dark</option>
      <option value="light">☀️ Light</option>
      <option value="gold">✨ Gold</option>
    </select>
    <button class="auth-btn" id="authBtn">Login / Sign Up</button>
    <span id="userEmailDisplay" style="display:none; color:var(--primary); font-weight:bold;"></span>
    <button class="admin-btn" id="adminBtn" style="display:none;"> Admin</button>
    <button class="upload-btn" id="createSurahBtn" style="display:none;"><span class="plus">+</span> New Surah</button>
  </div>
</header>

<div id="surahView">
  <main class="grid-container" id="surahGrid">
    <div class="loader" id="mainLoader"></div>
  </main>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">📂</div>
    <h2>No Surahs yet</h2>
    <p>Admin: Click "New Surah" to start!</p>
  </div>
</div>

<div id="ayatView" style="display:none;">
  <div class="folder-actions" style="margin-top:20px;">
    <button class="upload-btn small" id="uploadAyatBtn" style="display:none;"><span class="plus">+</span> Upload Ayat</button>
    <button class="btn-save small" id="downloadAllBtn"> Download All (ZIP)</button>
  </div>
  <main class="grid-container" id="ayatGrid"></main>
  <div class="empty-state" id="ayatEmptyState" style="display:none;">
    <div class="empty-icon"></div>
    <h2>No Ayats yet</h2>
    <p>Admin: Click "Upload Ayat" to add PDFs!</p>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="modal" id="authModal">
  <div class="modal-content">
    <button class="close-btn" id="closeAuth">✕</button>
    <h2 id="authTitle">Login</h2>
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabLogin">Login</button>
      <button class="tab-btn" id="tabSignup">Sign Up</button>
    </div>
    <input type="email" id="authEmail" placeholder="Email address" />
    <input type="password" id="authPassword" placeholder="Password" />
    <button class="btn-save" id="submitAuth" style="width:100%; margin-top:15px;">Login</button>
    <div style="text-align:center; margin: 15px 0; color:#aaa;">OR</div>
    <button class="btn-google" id="googleAuthBtn">🔵 Continue with Google</button>
    <p id="authMessage" style="color:red; text-align:center; margin-top:10px; font-size:0.9rem;"></p>
  </div>
</div>

<!-- COMMENTS MODAL -->
<div class="modal" id="commentsModal">
  <div class="modal-content large-modal">
    <button class="close-btn" id="closeComments">✕</button>
    <h2 id="commentsTitle">Comments</h2>
    <div id="commentsList" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px;"></div>
    <textarea id="commentInput" placeholder="Write your comment..." style="width:100%; padding:10px; background:rgba(255,255,255,0.08); border:1px solid var(--card-border); border-radius:10px; color:var(--text); min-height:80px;"></textarea>
    <button class="btn-save" id="postCommentBtn" style="width:100%; margin-top:10px;">Post Comment</button>
  </div>
</div>

<!-- SURAH & AYAT MODALS (Keep existing) -->
<div class="modal" id="surahModal">
  <div class="modal-content">
    <h2>Create Surah Folder</h2>
    <label>Surah Name</label><input type="text" id="surahName" placeholder="e.g. Al-Baqarah" />
    <label>Surah Number</label><input type="text" id="surahNumber" placeholder="e.g. 2" />
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelSurah">Cancel</button>
      <button class="btn-save" id="saveSurah">Create</button>
    </div>
  </div>
</div>

<div class="modal" id="ayatModal">
  <div class="modal-content">
    <h2>Upload Ayat PDF</h2>
    <label>Ayat Number</label><input type="number" id="ayatNumber" placeholder="e.g. 1" />
    <input type="file" id="ayatFileInput" accept="application/pdf" hidden />
    <button class="btn-save" id="selectFileBtn" style="width:100%; margin-top:10px;">Select PDF File</button>
    <p id="selectedFileName" style="color:#aaa; margin-top:10px; text-align:center;"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelAyat">Cancel</button>
      <button class="btn-save" id="saveAyat">Upload</button>
    </div>
  </div>
</div>

<!-- PDF VIEWER -->
<div class="viewer" id="viewer">
  <div class="viewer-header">
    <h2 id="viewerTitle">Ayat Viewer</h2>
    <div class="viewer-controls">
      <button id="zoomOutBtn">− Zoom</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomInBtn">Zoom +</button>
      <div class="page-nav">
        <span>Page</span>
        <input type="number" id="pageInput" min="1" placeholder="1" />
        <span>of <span id="totalPagesDisplay">0</span></span>
        <button id="goToPageBtn">Go</button>
      </div>
      <a id="downloadBtn" href="#" target="_blank" download class="btn-download"> Download</a>
      <button id="closeViewer">✕</button>
    </div>
  </div>
  <div class="viewer-body" id="viewerBody">
    <div id="pdfContainer"></div>
  </div>
</div>

<script src="app.js?v=12" defer></script>
</body>
</html>
